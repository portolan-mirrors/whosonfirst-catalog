# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Data files are
# never placed under publish_dir, so they cannot be published by accident.
#
# Source Cooperative serves these objects. data.source.coop returns raw bytes.
# source.coop renders the human-facing page.

# The S3 URI uploads are written to.
#
# This names the data.source.coop gateway's view of the bucket: there the
# organization is the bucket and the repository is the first key segment.
# Local publishes go through this door with the publisher's own Source
# Cooperative credentials (`source-coop login`). CI with an approved IAM role
# would instead write to the real bucket,
# s3://us-west-2.opendata.source.coop/portolan-mirrors/whosonfirst-catalog,
# with no endpoint_url -- same bytes, different door.
write_prefix: s3://portolan-mirrors/whosonfirst-catalog

# The public base URL that serves write_prefix. Every href in the catalog is
# built from this, so it goes in the STAC JSON and write_prefix does not.
public_base: https://data.source.coop/portolan-mirrors/whosonfirst-catalog

region: us-west-2

# The S3-compatible endpoint that serves write_prefix's bucket. Required in
# gateway mode (see write_prefix); remove it, and rewrite write_prefix to the
# real bucket, when publishing through an approved IAM role instead.
endpoint_url: https://data.source.coop

# The named AWS profile the publisher uses. Optional -- CI leaves it unused,
# because configure-aws-credentials puts the assumed role in the environment
# and publish.py prefers that whenever AWS_ACCESS_KEY_ID is set.
profile: source-coop

# The directory that IS the published catalog, synced 1:1 to write_prefix.
# Nothing outside it is ever uploaded.
publish_dir: catalog

# The staging directory that holds data files, read by tools/upload_data.py.
# tools/publish.py never reads this key, so setting it does not widen the
# publish boundary. The build writes here, and tools/wofcommon.py takes the
# same path from WOF_STAGING. Only the suffixes in PUBLISHABLE_SUFFIXES
# upload, so the geocode.earth downloads under sources/ and the intermediates
# under work/ stay out of the bucket although they sit in the same tree.
#
# This catalog is metadata-first: its boundary assets link straight to
# geocode.earth's own files, so the only bytes staged here are the ones a
# browser client cannot get from there. See catalog/AGENTS.md, "What this
# catalog builds, and what it links".
data_dir: ../whosonfirst-staging/publish
